<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TV Receiver - WebRTC Screenshare</title>
  <style>
    body { font-family: sans-serif; background: #121212; color: #fff; padding: 20px; text-align: center; margin: 0; }
    .receiver-box { max-width: 800px; margin: 40px auto; background: #1a1a1a; padding: 30px; border-radius: 8px; border: 1px solid #333; }
    .room-signal { font-size: 32px; font-weight: bold; color: #0078d4; margin: 20px 0; letter-spacing: 3px; }
    #status { margin: 15px 0; color: #aaa; font-style: italic; font-size: 16px; }
    #remoteVideo { width: 100%; background: #000; margin-top: 20px; border-radius: 4px; border: 1px solid #222; }
    #remoteVideo:fullscreen { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>

  <div class="receiver-box">
    <h1>TV Receiver</h1>
    <p>Scan the QR code or enter these words on your streaming device:</p>

    <div id="myRoomId" class="room-signal">GENERATING WORDS...</div>
    <div id="status">Initializing system...</div>

    <video id="remoteVideo" autoplay playsinline controls></video>
  </div>

  <script type="module" src="/src/receiver/main.js"></script>
</body>
</html>
