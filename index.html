<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>TV Receiver - Screencast</title>
  <link rel="stylesheet" href="/src/shared/app.css">
</head>
<body>

  <div class="receiver">
    <div class="qr" id="qrContainer"></div>

    <div class="secret" id="wordsContainer">
      <span>generating</span><span>words</span><span>...</span><span>...</span>
    </div>

    <div class="share-url" id="shareUrl"></div>

    <h1>TV Receiver</h1>
    <p>Scan the QR code above or enter the 4 pairing words on your streaming device.</p>

    <div id="status" class="status">Initializing safe tracker connection...</div>

    <video id="remoteVideo" class="video-fullscreen" style="display: none;" autoplay playsinline></video>
  </div>

  <a href="/share" class="share-button">I want to share</a>

  <script type="module" src="/src/receiver/main.js"></script>
</body>
</html>
